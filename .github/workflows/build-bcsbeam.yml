name: Build BCS Beam (Windows x86_64)
# Trimmed from upstream rustdesk/rustdesk's flutter-build.yml: same two
# prerequisite reusable workflows (bridge codegen, TempTopMostWindow helper),
# same single windows-2022 + Flutter + vcpkg build job, minus every other
# platform (macOS/iOS/Android/Linux/web/sciter) and minus RustDesk's own
# internal signing step (SIGN_BASE_URL — that's their infra, not ours; signing
# for this fork is a separate follow-up via SignPath/Sectigo, see
# backend/docs/BCS_BEAM_WINDOWS_CLIENT_PLAN_20260824.md in the main finance repo).
#
# Version pins matched to upstream's own CI as of this fork's base
# (rustdesk/rustdesk 1.3.9) — keep these in sync with upstream if you ever
# rebase onto a newer tag; version drift is a common cause of build breakage
# per upstream's own GitHub issues.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SCITER_RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "6f29f12e82a8293156836ad81cc9bf5af41fe836"
  VERSION: "1.3.9-bcsbeam"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-topmost-window:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  build-windows:
    name: BCS Beam Windows build
    needs: [generate-bridge, build-topmost-window]
    runs-on: windows-2022
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Restore bridge files
        uses: actions/download-artifact@master
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v1
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # https://github.com/flutter/flutter/issues/155685
      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          # BCS Beam fix (2026-08-24): this previously checked $VCPKG_ROOT (an
          # undefined plain PowerShell variable, always $null) instead of
          # $env:VCPKG_ROOT — the guard always tripped and failed instantly
          # (0s) regardless of whether run-vcpkg had set it up correctly.
          if (-not ($env:VCPKG_ROOT -and (Test-Path $env:VCPKG_ROOT))) {
            Write-Error "VCPKG_ROOT not set by run-vcpkg action"
            exit 1
          }
          & "$env:VCPKG_ROOT\vcpkg" install --triplet x64-windows-static --x-install-root="$env:VCPKG_ROOT\installed"
          if ($LASTEXITCODE -ne 0) {
            # BCS Beam diagnostic (2026-08-24): three straight failures at this
            # step, all "Download failed, halting portfile" with identical
            # ~3m20s timing — deterministic, not a transient flake. Dumping the
            # actual vcpkg log as an ::error:: workflow command so it lands in
            # this run's Checks-API annotations, which are readable without a
            # repo token (unlike raw step logs) — see
            # backend/docs/BCS_BEAM_WINDOWS_CLIENT_PLAN_20260824.md in the main
            # finance repo for why that access gap exists.
            Get-ChildItem -Path "$env:VCPKG_ROOT" -Filter "*.log" -Recurse -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending | Select-Object -First 3 | ForEach-Object {
                $content = Get-Content $_.FullName -Raw
                $tail = if ($content.Length -gt 3500) { $content.Substring($content.Length - 3500) } else { $content }
                $tail = $tail -replace "`r`n", " | " -replace "`n", " | "
                Write-Host "::error::VCPKG LOG $($_.Name): $tail"
              }
            exit 1
          }
        shell: pwsh

      - name: Build BCS Beam (rustdesk fork)
        run: |
          python3 .\build.py --portable --hwcodec --flutter --vram --skip-portable-pack
          mv ./flutter/build/windows/x64/runner/Release ./bcsbeam-remote

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@master
        with:
          name: topmostwindow-artifacts
          path: "./bcsbeam-remote"

      - name: Upload unsigned build artifact
        uses: actions/upload-artifact@master
        with:
          name: bcsbeam-remote-windows-x86_64-unsigned
          path: bcsbeam-remote

      - name: Build self-extracted executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../bcsbeam-remote/ -o . -e ../../bcsbeam-remote/rustdesk.exe
          popd
          mkdir -p ./SignOutput
          mv ./target/release/rustdesk-portable-packer.exe ./SignOutput/BCSBeamRemote-${{ env.VERSION }}-x86_64.exe

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build msi
        run: |
          pushd ./res/msi
          python preprocess.py --arp -d ../../bcsbeam-remote
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          mv ./Package/bin/x64/Release/en-us/Package.msi ../../SignOutput/BCSBeamRemote-${{ env.VERSION }}-x86_64.msi
          sha256sum ../../SignOutput/BCSBeamRemote-*.msi

      - name: Upload SignOutput (unsigned .exe/.msi — sign separately, see the Windows client plan doc)
        uses: actions/upload-artifact@master
        with:
          name: bcsbeam-remote-signoutput-unsigned
          path: SignOutput
